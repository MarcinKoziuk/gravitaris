# Rates for the materials economy and the round-level timers around it
# (docs/gravity-well-mode-plan.md Phase 3). Per-tick or in ticks at
# Game::PHYSICS_DELTA unless a key says seconds.

# A Colony digs raw materials out of its planet and pushes them to that
# planet's own Base and High Port -- two separate draws against one store, one
# per structure, not a shared cap.
[colony]
raw_production_per_tick = 0.5
raw_cap = 200.0
supply_rate = 0.4

# A Base or High Port converts raw into finished, then spends finished.
[production]
conversion_rate = 0.3
finished_cap = 200.0
freighter_cost = 60.0
# What a Base spends developing its own planet -- a Lab, then a Comm Center.
# Same new-unit rule as a freighter, but same-planet and instant.
self_development_cost = 40.0

# Freighters fly slowly and visibly, but above planetary orbital speed (51-79
# at the sector's orbit radii) -- under it a freighter can never close on its
# target and spends minutes arcing around the star waiting for the planet to
# come to it. arrival_radius sits past the High Port's own orbit so a parking
# freighter never lands on top of one.
[freighter]
transit_speed = 80.0
transit_acceleration = 20.0
arrival_radius = 440.0
cargo_unload_interval_ticks = 300
cargo_one_raw_materials = 25.0

# How many fighters an AI faction is FIELDED with behind its leader -- not how
# many it ends up with. A side starts as one ship, and every /ai after the one
# that fielded it puts another fighter behind each leader, so the opposition is
# dialled up by asking for it rather than decided here.
#
# Each wingman is funded and respawned exactly like a player's, so a side that
# has lost its production flies fewer of them than were asked for.
#
# Deliberately NOT the built-in default in EconomyConfig: if this file ever
# stops being read, wingmen nobody asked for are the symptom, which is a good
# deal more visible than a value that silently agreed with the fallback.
[ai]
wing_size = 0

# How long a build site stays shut after something on it came down, per
# structure type and per planet. Levelling a Colony should cost the side that
# owned it a real stretch of production, not one freighter run -- without this
# the replacement is dispatched on the tick after the wreck clears, and a
# structure a defender never has to protect is not worth attacking.
[rebuild]
lockout_ticks = 1800

# Consecutive landed ticks before a claim fires: long enough that a bounce or
# a graze never claims, short enough to feel immediate after a real touchdown.
[conquest]
claim_ticks = 60

# Seconds one Lab needs to pay out a batch of Tech alone; N labs pay out N
# times as fast. Research is unfunded -- no materials cost yet.
#
# Tech is the PERMANENT tree's currency, shared across the faction and
# uncapped: nothing idles a lab, because the pressure to come home is that a
# hull stays stock until its pilot lands, not that the side stops learning.
[research]
seconds_per_tech = 30.0
tech_per_fill = 2

# Supplies are the SHIP tree's currency and a pilot's own, banked across every
# life. They accrue simply for being out there, and faster for winning fights;
# spending them needs a landing, which is the whole of the come-home rule.
[supplies]
per_second = 0.6
per_kill = 8

# Hull per second restored to a ship standing on one of its own developed
# planets (a Base and a Colony, the same pairing a respawn needs). Free --
# coming home and staying still is the whole cost.
[repair]
hull_per_second = 10.0
