<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The top gatling tier's round: bullet-heavy's tracer in cyan, and longer,
     so the heaviest gun on the field is readable as such from across it. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     version="1.1"
     width="10"
     height="52"
     viewBox="-5 -26 10 52">
  <g inkscape:groupmode="layer" inkscape:label="model">
    <path d="M 0,-22 L 0,22"
          style="fill:none;stroke:#00ffff;stroke-width:1;stroke-linecap:butt" />
  </g>
  <g inkscape:groupmode="layer" inkscape:label="@body" style="display:none">
    <circle cx="0" cy="0" r="0.5"
            style="fill:#ff0000;stroke:none" />
  </g>
</svg>
