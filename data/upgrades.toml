# The weapon table, plus the research pool a Lab draws its offers from (see
# UpgradeCatalog). `kind` selects a rule the sim implements; everything else
# here is a magnitude.
#
# `key` is what the wire, the audio system and the save format address a
# weapon or upgrade by -- renaming one invalidates any pick in flight, so
# treat it as an id, not a label.

# ---- weapons ---------------------------------------------------------------
# Everything that shoots names one of these. A weapon owns its own projectile
# model and fire sound, so adding a line is a data edit here plus the assets.

[[weapon]]
key = "autocannon"
hardpoint = "weapon"
name = "Autocannon"
cooldown_ticks = 7
damage = 10.0
speed = 200.0
lifetime_seconds = 3.0
model = "models/bullets/bullet-0"
sound = "sounds/laser-1.wav"
sound_gain = 0.5

# The heavy line: an A-10 gatling, written out per tier rather than as a curve.
# Each tier hits harder and throws flatter, and cycles faster as the feed
# improves -- any one of them can be tuned without touching the others.
#
# Every tier out-cycles and out-ranges the light gun of the same rank
# (speed * lifetime_seconds is the reach): the magazine is what a heavy mount
# pays for that, and the light guns' case against it is that they never run dry.
#
# A heavy round is a tracer, not a dot: the tiers fire bullet-heavy rather
# than the stock bullet-0, and the top one its own cyan streak, so what a ship
# is shooting is readable from the rounds alone.
[[weapon]]
key = "gatling_1"
hardpoint = "weapon"
name = "Gatling"
cooldown_ticks = 5
damage = 15.0
speed = 224.0
lifetime_seconds = 3.6
model = "models/bullets/bullet-heavy"
sound = "sounds/gatling-1.wav"
sound_gain = 0.7

[[weapon]]
key = "gatling_2"
hardpoint = "weapon"
name = "Gatling II"
cooldown_ticks = 4
damage = 21.0
speed = 320.0
lifetime_seconds = 3.8
model = "models/bullets/bullet-heavy"
sound = "sounds/gatling-1.wav"
sound_gain = 0.7

# Flat enough that lead barely matters inside knife range -- the tier's real
# reward as much as the damage is.
[[weapon]]
key = "gatling_3"
hardpoint = "weapon"
name = "Gatling III"
cooldown_ticks = 3
damage = 30.0
speed = 420.0
lifetime_seconds = 4.2
model = "models/bullets/bullet-heavy-cyan"
sound = "sounds/gatling-1.wav"
sound_gain = 0.7

# The beam line. Nothing here is a projectile: a laser reaches whatever it is
# pointed at the tick the trigger goes down, so `speed`, `lifetime_seconds` and
# `model` mean nothing to one and are left out. What it has instead is a
# [beam] block, and a non-zero `range` in it is what marks a weapon as one.
#
# Weaker than the guns and paid for differently: damage is per SECOND rather
# than per hit, it falls away to nothing across the reach, and every second of
# it comes out of the capacitor rather than a magazine. Point blank a beam
# out-damages the autocannon; at half its reach it does not, and at the far end
# it is a light show. That is the whole weapon -- it rewards being close, which
# is exactly where a pilot least wants to be.
[[weapon]]
key = "laser_1"
hardpoint = "weapon"
name = "Laser"
damage = 0.0 # per-hit damage means nothing to a beam; see [beam] below
sound = "sounds/laser-1.wav"
sound_gain = 0.4

[weapon.beam]
range = 450.0
# Against the autocannon's ~86/s: better in the first third of the reach, worse
# after it.
damage_per_second = 95.0
# A rank-I capacitor is 160, so a bank spends itself on about two and a half
# seconds of held fire -- and none of it is available to the overburn.
energy_per_second = 65.0
falloff_start = 0.0
width_near = 0.8
width_far = 5.0
heat = 0.15

[[weapon]]
key = "laser_2"
hardpoint = "weapon"
name = "Laser II"
damage = 0.0
sound = "sounds/laser-1.wav"
sound_gain = 0.4

[weapon.beam]
range = 560.0
damage_per_second = 130.0
energy_per_second = 72.0
# Reach is the tier's real reward as much as the damage: the first third of it
# is now full-strength rather than only the muzzle.
falloff_start = 0.3
width_near = 0.9
width_far = 5.5
heat = 0.3

[[weapon]]
key = "laser_3"
hardpoint = "weapon"
name = "Laser III"
damage = 0.0
sound = "sounds/laser-1.wav"
sound_gain = 0.45

[weapon.beam]
range = 680.0
damage_per_second = 170.0
energy_per_second = 80.0
falloff_start = 0.45
width_near = 1.0
width_far = 6.0
heat = 0.45

# The missile line. A hull carries no launcher at all until MISSILE BAY is
# fitted; each tier of that upgrade fits the next round up and widens the rack.
#
# `guidance` is MissileSystem's homing envelope -- turn_rate in rad/s. A round
# that loiters is one a pilot cannot break from, however hard they turn, so
# lifetime_seconds is what separates a nuisance from a threat: the first tier
# burns out before it has crossed a dogfight, the last one follows you out of
# it. Everything else here is tuned around that.
#
# `wobble` is how badly the seeker hunts around its lead solution, in radians of
# heading error. A cheap seeker weaves visibly and is worth dodging into; the
# top tier is zero and flies the solution dead straight.
# The light-gun line. Rank 1 is the weapon every hull spawns with, so the line
# starts at what a pilot already has rather than above it; the ranks above are a
# wider bore on the same mount. No feed, no magazine -- see `light_guns`.
[[weapon]]
key = "autocannon_2"
hardpoint = "weapon"
name = "Autocannon II"
cooldown_ticks = 6
damage = 14.0
speed = 240.0
lifetime_seconds = 3.0
model = "models/bullets/bullet-0"
sound = "sounds/laser-1.wav"
sound_gain = 0.5

[[weapon]]
key = "autocannon_3"
hardpoint = "weapon"
name = "Autocannon III"
cooldown_ticks = 5
damage = 19.0
speed = 280.0
lifetime_seconds = 3.2
model = "models/bullets/bullet-0"
sound = "sounds/laser-1.wav"
sound_gain = 0.55

[[weapon]]
key = "missile_mk1"
hardpoint = "missile"
name = "Missile"
cooldown_ticks = 36
damage = 22.0
speed = 140.0
lifetime_seconds = 4.0
model = "models/missiles/missile-0"
sound = "sounds/laser-1.wav"
guidance = { turn_rate = 1.2, acceleration = 90.0, top_speed = 210.0, wobble = 0.22 }

[[weapon]]
key = "missile_mk2"
hardpoint = "missile"
name = "Missile II"
cooldown_ticks = 30
damage = 28.0
speed = 150.0
lifetime_seconds = 5.5
model = "models/missiles/missile-0"
sound = "sounds/laser-1.wav"
guidance = { turn_rate = 1.6, acceleration = 110.0, top_speed = 235.0, wobble = 0.09 }

[[weapon]]
key = "missile_mk3"
hardpoint = "missile"
name = "Missile III"
cooldown_ticks = 26
damage = 34.0
speed = 160.0
lifetime_seconds = 7.0
model = "models/missiles/missile-0"
sound = "sounds/laser-1.wav"
guidance = { turn_rate = 2.0, acceleration = 130.0, top_speed = 260.0, wobble = 0.0 }

# ---- fittings --------------------------------------------------------------

# What an unupgraded hull carries. No missile: the launcher is researched, not
# issued, so there is no `missile` fitting here to fall back on.
[ship]
gun = "autocannon"

# Base/High Port turrets (StructureDefenseSystem) fire the same round a stock
# ship does. An emplacement has no magazine to run dry and nothing to do but
# shoot, so it holds a steady stream on whatever comes inside its range rather
# than taking the occasional pot shot -- getting close to a defended complex is
# meant to be the hard part of taking one.
[turret]
weapon = "autocannon"
fire_range = 600.0
fire_cooldown_ticks = 9

# ---- the tech pool ---------------------------------------------------------
#
# Every entry below appears in both trees. A faction spends Tech to learn a
# rank (`tech_cost`, a ladder -- rank II is only offered once it holds I), and
# a pilot spends Supplies to fit one onto a hull (`supply_cost`, a menu -- any
# rank the faction has learned can be bought outright, and never above it).
#
# `supply_cost` is the FULL price of that rank, not a step up to it: a hull
# that skipped I and II pays only what III costs. That is what lets a pilot
# short on Supplies fit II instead, and what makes refitting after a death one
# purchase rather than a climb. A shorter list than `max_level` extends its
# last entry to the ranks above it.
#
# Tech is slow and shared, so the prices below buy a handful of strategic
# decisions across a match; Supplies accrue continuously, so theirs are the
# small change of every landing.

# The launcher itself, and the only way onto the missile line: a hull that
# hasn't fitted this has no rack, and MISSILE CONTAINER stays off its tree
# (`requires`). Each rank fits the next round up and deepens the rack by
# `capacity`, so the ceiling is 24 rounds.
#
# A hull carries exactly one bay (fighter-1 authors one `missile_0` slot), so a
# rank here is a better round rather than another tube.
[[upgrade]]
key = "missile_bay"
slots = ["missile"]
icon = "bay"
name = "MISSILE BAY"
description = "Fits the launcher, then a harder round. Eight more rounds each time."
kind = "missile_tier"
max_level = 3
weight = 1.0
tiers = ["missile_mk1", "missile_mk2", "missile_mk3"]
capacity = 8 # per level; the fitting arrives with the rack full
tech_cost = [3, 5, 8]
supply_cost = [12, 26, 44]

# The two ammo boxes. Both go in the hull's generic stowage bays (`ammo`, two
# of them on fighter-1), and either box fits either bay -- so what a pilot
# stows is a choice rather than a pair of fixed holes: two boxes of shells, two
# containers of rounds, or one of each. Buying a box into an occupied bay swaps
# what was there.
#
# `research = false`: shells are not a technology. Neither box appears on the
# PERMANENT board and no unlocked rank gates them -- a yard sells them off the
# shelf to any hull whose side has learned the weapon they feed. That `requires`
# is the only gate either of them has, and it asks what the faction knows rather
# than what this hull is already carrying: the rounds and the gun are one visit.
#
# One rank each: a box is either in a bay or it isn't, and a second one is a
# second bay rather than a better box. Spares sit on top of what the weapon's
# own tier holds, and both are cheap next to the weapon itself -- this is the
# small purchase that keeps a working loadout in the fight, not one that
# changes what it can do.

[[upgrade]]
key = "shell_box"
slots = ["ammo"]
icon = "shl"
name = "CANNON SHELL BOX"
description = "Belted rounds stowed aft. A whole magazine again, for the mounts that run out."
kind = "ammo_store"
ammo_pool = "cannon"
research = false
max_level = 1
weight = 0.7
capacity = 40 # on top of the cannon tier's own 40 per rank
requires = "heavy_cannons"
supply_cost = 8

[[upgrade]]
key = "missile_container"
slots = ["ammo"]
icon = "mis"
name = "MISSILE CONTAINER"
description = "Eight more rounds for the rack, and the space to stow them."
kind = "ammo_store"
ammo_pool = "missile"
research = false
max_level = 1
weight = 0.7
capacity = 8 # matching what a rank of the bay itself adds
requires = "missile_bay"
supply_cost = 10

# The drive. Straight-line performance: harder acceleration and a higher cruise.
#
# The scales below are PER RANK ABOVE STOCK, compounding. Rank I is the motor the
# hull was drawn with and scales nothing at all, so a stock ship flies on its own
# authored [physics] thrust and max_speed -- the numbers everything else in the
# game is tuned against. Rank III of a 1.12/1.08 engine is therefore 1.25x the
# thrust and 1.17x the speed of stock, not 1.4x and 1.26x.
#
# The overburn is the drive's too. Its real job is arriving: a hull bearing down
# on a planet at cruise cannot brake in time on its own thrust, and this is what
# turns that into a stop. The extra speed is the sweetener -- a burst of closing
# or breaking speed in a fight -- and it is deliberately modest, since the whole
# combat model assumes a ship can be caught.
#
# boost_thrust_scale is authored per rank rather than compounded: a burn is a
# step change, and three chosen numbers read better than a curve. Nothing here
# says how LONG a burn lasts -- that is the capacitor's, and a hull carrying no
# bank cannot light the injector at all however good its motor is.
#
# boost_max_speed_scale is the one number that bounds a boosted hull: 1.2 of the
# hull's own [physics] max_speed, and ranks never move it. A hull whose engines
# already out-run that ceiling gets thrust out of a burn and no more speed.
[[upgrade]]
key = "engine"
slots = ["engine"]
icon = "eng"
name = "ENGINE"
description = "A bigger drive on the same hull. Gets there faster, and burns harder when you overrun it."
kind = "engine_tier"
max_level = 3
weight = 1.0
thrust_scale = 1.12
max_speed_scale = 1.08
boost_thrust_scale = [1.8, 2.2, 2.6]
boost_max_speed_scale = 1.2
boost_drain_per_second = 100.0
# Rank I costs no Tech, which is what marks it as issued rather than researched:
# every faction starts holding it (ResearchSystem::IssueFreeUnlocks) and every
# hull spawns with it fitted, the same way it spawns with its light guns. A hull
# that has had its drive pulled cannot accelerate at all.
tech_cost = [0, 4, 7]
supply_cost = [0, 22, 38]

[[upgrade]]
key = "autoloader"
slots = ["support"]
icon = "ald"
name = "AUTOLOADER"
description = "Cannon cycles a third faster. Same round, more of them."
kind = "fire_rate"
max_level = 3
weight = 1.0
cooldown_scale = 0.72
tech_cost = [2, 4, 7]
supply_cost = [8, 18, 32]

# The two things a weapon mount can hold. Every mount takes either, so what a
# hull is armed with is a choice about weight of fire against endurance rather
# than about which hole a part fits.

# Light guns: what a hull flies with, and what it falls back to. They never run
# out, which is the whole of their case against the cannons below.
[[upgrade]]
key = "light_guns"
slots = ["gun", "cannon"]
icon = "gun"
name = "LIGHT GUNS"
description = "Wing-calibre autocannon. Lighter than a heavy mount, and it never runs dry."
kind = "weapon_tier"
max_level = 3
weight = 1.0
tiers = ["autocannon", "autocannon_2", "autocannon_3"]
tech_cost = [0, 2, 5]
supply_cost = [0, 10, 24]

# Heavy cannons: the weight of fire, and the only primary that runs out.
[[upgrade]]
key = "heavy_cannons"
slots = ["gun", "cannon"]
icon = "hvy"
name = "HEAVY CANNONS"
description = "Depleted-slug autocannon. Hits far harder than the light guns, and runs out."
kind = "cannon_tier"
requires = "light_guns"
max_level = 3
weight = 1.0
# One weapon per rank, in order: fitting the rank fits its weapon.
tiers = ["gatling_1", "gatling_2", "gatling_3"]
# Rounds the magazine holds per rank; a fitting arrives with it full. Deep next
# to the missile rack's handful: this is the weapon a pilot leans on until it is
# dry, not one they save for a shot worth taking.
capacity = 40
tech_cost = [3, 6, 10]
supply_cost = [14, 30, 52]

# Beam emitters, in the same mounts the guns and cannons compete for -- so a
# three-mount hull chooses between three lasers, three cannons, or any mix of
# them, and that choice is the loadout rather than a slot the ship happens to
# have. Aimed rather than pointed: its own trigger, swung with the mouse
# through whatever arc the hull's gimbals allow ([weapons] aim_arc_degrees).
#
# Behind the CAPACITOR rather than behind another weapon, because that is
# literally what fires it -- an emitter on a hull with no bank is a hole in the
# wing.
[[upgrade]]
key = "lasers"
slots = ["gun", "cannon"]
icon = "lsr"
name = "LASERS"
description = "Gimballed beam emitter. Aim it with the mouse. Hits hardest up close, fades to nothing at range, and drinks the bank."
kind = "laser_tier"
requires = "capacitor"
max_level = 3
weight = 1.0
tiers = ["laser_1", "laser_2", "laser_3"]
tech_cost = [3, 6, 10]
supply_cost = [12, 26, 44]

# The bank. Everything that draws power in flight draws it from here: the
# drive's overburn, and every laser a hull is carrying. Nothing else decides how
# long either can run, which is what makes this the fitting that turns two
# separate purchases into working hardware -- a hull without it has a motor it
# cannot overrun and emitters it cannot fire.
#
# It is a BANK, not a timer: it only drains while something is actually drawing
# on it, so a burst costs what it burns and nothing else. recharge_seconds is
# how long refilling an empty one takes, per rank -- authored rather than scaled
# so a deeper bank is not forced to be a slower one.
[[upgrade]]
key = "capacitor"
# The hole the injector used to sit in: same place on the schematic, and the
# board still needs one category per non-mounted fitting to tell them apart.
slots = ["thruster"]
icon = "cap"
name = "CAPACITOR"
description = "Charge bank feeding the overburn and the lasers. Spend it in bursts; it fills back up when you let off."
kind = "capacitor"
requires = "engine"
max_level = 3
weight = 1.0
# Against the drive's 100/s overburn: 1.6s, 2.8s and 4.2s of held burn.
charge = [160.0, 280.0, 420.0]
recharge_seconds = [9.0, 7.0, 5.0]
tech_cost = [2, 4, 7]
supply_cost = [10, 22, 38]

[[upgrade]]
key = "bubble_shield"
slots = ["shield"]
icon = "bub"
name = "BUBBLE FIELD"
description = "Wide reservoir, absorbs a hit whole -- but slow to come back."
kind = "shield"
shield_type = "bubble"
max_level = 3
weight = 0.9
capacity = 90.0
regen_per_second = 2.0
regen_delay_seconds = 3.0
leak_chance = 0.0 # a bubble never lets a round through while it has charge
tech_cost = [3, 5, 9]
supply_cost = [15, 32, 55]

[[upgrade]]
key = "plating_shield"
slots = ["shield"]
icon = "plt"
name = "FIELD PLATING"
description = "Hull-hugging. Some rounds get through -- but it mends what does."
kind = "shield"
shield_type = "plating"
# The bubble first: a side learns to hold a field at all before it learns to
# wrap one round a hull. Checked against what the FACTION has learned rather
# than what this hull carries -- the two emitters replace each other, so no
# hull can ever have a bubble fitted at the moment it fits plating.
requires = "bubble_shield"
max_level = 3
weight = 0.9
capacity = 112.0
regen_per_second = 7.0
regen_delay_seconds = 1.0
# Plating leaks by chance rather than by a fixed share of every hit: half the
# rounds are stopped whole, and the rest put leak_fraction of themselves into
# the hull behind. That is what keeps it from being strictly better than the
# bubble's bigger, slower reservoir -- and what makes a bad exchange under it
# a run of luck rather than arithmetic.
leak_chance = 0.5
# One entry per level: a quarter of the round gets through at the first layer,
# a tenth at the third.
leak_fraction = [0.25, 0.175, 0.10]
# Seconds to mend a full hull, one entry per level. The plates' answer to what
# they let through: the damage is real but it is not permanent, so a plated
# pilot need not fly home for every leak the way a bubble pilot must.
hull_regen_seconds = [90.0, 45.0, 30.0]
tech_cost = [3, 5, 9]
supply_cost = [15, 32, 55]
