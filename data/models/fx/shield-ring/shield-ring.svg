<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Shield ring: an unfilled circle drawn around a ship carrying a shield,
     scaled to its emitter and dimmed with its charge (see CGame's shield
     overlay). Stroke is the team-color placeholder (#ff00ff) so the
     per-instance color drives it, same convention as team-marker.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <g inkscape:label="model" inkscape:groupmode="layer">
    <circle style="fill:none;stroke:#ff00ff;stroke-width:3px" cx="0" cy="0" r="50" />
  </g>
  <g inkscape:label="@origin" inkscape:groupmode="layer" style="display:none">
    <circle style="fill:#ff0000;fill-opacity:0;stroke:#d45500" cx="0" cy="0" r="2.5" />
  </g>
</svg>
