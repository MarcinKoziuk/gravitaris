# ---- fittings --------------------------------------------------------------

# What an unupgraded hull carries. No missile: the launcher is researched, not
# issued, so there is no `missile` fitting here to fall back on.
[ship]
gun = "autocannon"

# Base/High Port turrets (StructureDefenseSystem) fire the same round a stock
# ship does, on their own much slower cadence.
[turret]
weapon = "autocannon"
fire_range = 400.0
fire_cooldown_ticks = 90

# ---- the tech pool ---------------------------------------------------------
#
# Every entry below appears in both trees. A faction spends Tech to learn a
# rank (`tech_cost`, a ladder -- rank II is only offered once it holds I), and
# a pilot spends Supplies to fit one onto a hull (`supply_cost`, a menu -- any
# rank the faction has learned can be bought outright, and never above it).
#
# `supply_cost` is the FULL price of that rank, not a step up to it: a hull
# that skipped I and II pays only what III costs. That is what lets a pilot
# short on Supplies fit II instead, and what makes refitting after a death one
# purchase rather than a climb. A shorter list than `max_level` extends its
# last entry to the ranks above it.
#
# Tech is slow and shared, so the prices below buy a handful of strategic
# decisions across a match; Supplies accrue continuously, so theirs are the
# small change of every landing.

# The launcher itself, and the only way onto the missile line: a hull that
# hasn't fitted this has no rack, and MISSILE RACK stays off its tree
# (`requires`). Each rank fits the next round up and widens the rack by
# `capacity`, so the ceiling is 12 rounds -- a handful of kills, not a
# standoff weapon.
[[upgrade]]
key = "missile_bay"
slots = ["missile"]
icon = "bay"
name = "MISSILE BAY"
description = "Fits the launcher, then a harder round. Four more tubes each time."
kind = "missile_tier"
max_level = 3
weight = 1.0
tiers = ["missile_mk1", "missile_mk2", "missile_mk3"]
per_pickup = 4 # rounds that come with the fitting
capacity = 4   # per level
tech_cost = [3, 5, 8]
supply_cost = [12, 26, 44]

# The two ammo boxes. A hull has ONE ammo slot and there is one box per
# magazine, so fitting either takes the other one off -- carrying spares is a
# choice about which weapon this pilot expects to run dry, the same shape of
# decision the two shield emitters are.
#
# `research = false`: shells are not a technology. Neither box appears on the
# PERMANENT board and no unlocked rank gates them -- a yard sells them off the
# shelf to any hull whose side has learned the weapon they feed. That `requires`
# is the only gate either of them has, and it asks what the faction knows rather
# than what this hull is already carrying: the rounds and the gun are one visit.
#
# One rank each: a box is either aboard or it isn't. Spares sit on top of what
# the weapon's own tier holds, and both are cheap next to the weapon itself --
# this is the small purchase that keeps a working loadout in the fight, not one
# that changes what it can do.

[[upgrade]]
key = "shell_box"
slots = ["ammo"]
icon = "shl"
name = "CANNON SHELL BOX"
description = "Belted rounds stowed aft. Half again the magazine, for the mounts that run out."
kind = "ammo_store"
ammo_pool = "cannon"
research = false
max_level = 1
weight = 0.7
capacity = 20  # on top of the cannon tier's own 40 per rank
per_pickup = 20
requires = "heavy_cannons"
supply_cost = 8

[[upgrade]]
key = "missile_container"
slots = ["ammo"]
icon = "mis"
name = "MISSILE CONTAINER"
description = "Four more rounds for the rack, and the space to stow them."
kind = "ammo_store"
ammo_pool = "missile"
research = false
max_level = 1
weight = 0.7
capacity = 4 # matching what a rank of the bay itself adds
per_pickup = 4
requires = "missile_bay"
supply_cost = 10

# The drive. Straight-line performance: harder acceleration and a higher cruise.
#
# The scales below are PER RANK ABOVE STOCK, compounding. Rank I is the motor the
# hull was drawn with and scales nothing at all, so a stock ship flies on its own
# authored [physics] thrust and max_speed -- the numbers everything else in the
# game is tuned against. Rank III of a 1.12/1.08 engine is therefore 1.25x the
# thrust and 1.17x the speed of stock, not 1.4x and 1.26x.
#
# Deliberately NOT a multiplier on the overburn: OVERBURN's max_speed_scale
# stays a multiple of the hull's own [physics] max_speed, so one number still
# bounds how fast anything in the game can ever travel. A hull whose engines
# already out-run that ceiling gets thrust out of a burn and no more speed.
[[upgrade]]
key = "engine"
slots = ["engine"]
icon = "eng"
name = "ENGINE"
description = "A bigger drive on the same hull. Gets there faster, and stops asking as much of the burn."
kind = "engine_tier"
max_level = 3
weight = 1.0
thrust_scale = 1.12
max_speed_scale = 1.08
# Rank I costs no Tech, which is what marks it as issued rather than researched:
# every faction starts holding it (ResearchSystem::IssueFreeUnlocks) and every
# hull spawns with it fitted, the same way it spawns with its light guns. A hull
# that has had its drive pulled cannot accelerate at all.
tech_cost = [0, 4, 7]
supply_cost = [0, 22, 38]

[[upgrade]]
key = "autoloader"
slots = ["support"]
icon = "ald"
name = "AUTOLOADER"
description = "Cannon cycles a third faster. Same round, more of them."
kind = "fire_rate"
max_level = 3
weight = 1.0
cooldown_scale = 0.72
tech_cost = [2, 4, 7]
supply_cost = [8, 18, 32]

# The two things a weapon mount can hold. Every mount takes either, so what a
# hull is armed with is a choice about weight of fire against endurance rather
# than about which hole a part fits.

# Light guns: what a hull flies with, and what it falls back to. They never run
# out, which is the whole of their case against the cannons below.
[[upgrade]]
key = "light_guns"
slots = ["gun", "cannon"]
icon = "gun"
name = "LIGHT GUNS"
description = "Wing-calibre autocannon. Lighter than a heavy mount, and it never runs dry."
kind = "weapon_tier"
max_level = 3
weight = 1.0
tiers = ["autocannon", "autocannon_2", "autocannon_3"]
tech_cost = [0, 2, 5]
supply_cost = [0, 10, 24]

# Heavy cannons: the weight of fire, and the only primary that runs out.
[[upgrade]]
key = "heavy_cannons"
slots = ["gun", "cannon"]
icon = "hvy"
name = "HEAVY CANNONS"
description = "Depleted-slug autocannon. Hits far harder than the light guns, and runs out."
kind = "cannon_tier"
requires = "light_guns"
max_level = 3
weight = 1.0
# One weapon per rank, in order: fitting the rank fits its weapon.
tiers = ["gatling_1", "gatling_2", "gatling_3"]
# Rounds the magazine holds per rank, and what a fitting arrives loaded with.
# Deep next to the missile rack's handful: this is the weapon a pilot leans on
# until it is dry, not one they save for a shot worth taking.
capacity = 40
per_pickup = 40
tech_cost = [3, 6, 10]
supply_cost = [14, 30, 52]

# The overburn. Its real job is arriving: a hull bearing down on a planet at
# cruise cannot brake in time on its own thrust, and this is what turns that
# into a stop. The extra speed is the sweetener -- a burst of closing or
# breaking speed in a fight -- and it is deliberately modest, since the whole
# combat model assumes a ship can be caught.
#
# max_speed_scale is the one number that bounds a boosted hull: 1.2 of the
# hull's own [physics] max_speed, and levels never move it. They lengthen the
# burn and shorten the wait instead.
[[upgrade]]
key = "overburn"
# Its own hole, not the engine's: the drive and the injector are two fittings a
# hull carries at once, and one category per non-mounted fitting is what keeps
# the board able to tell which of them sits where.
slots = ["thruster"]
icon = "ovb"
name = "OVERBURN"
description = "Injector overrun: hard thrust, briefly past the redline. Then it has to cool."
kind = "boost"
requires = "engine"
max_level = 3
weight = 1.0
thrust_scale = 2.5
max_speed_scale = 1.2
duration_seconds = 1.6
cooldown_seconds = 9.0
min_cooldown_seconds = 3.0
tech_cost = [2, 4, 7]
supply_cost = [10, 22, 38]

[[upgrade]]
key = "bubble_shield"
slots = ["shield"]
icon = "bub"
name = "BUBBLE FIELD"
description = "Wide reservoir, absorbs a hit whole -- but slow to come back."
kind = "shield"
shield_type = "bubble"
max_level = 3
weight = 0.9
capacity = 90.0
regen_per_second = 2.0
regen_delay_seconds = 3.0
leak_chance = 0.0 # a bubble never lets a round through while it has charge
tech_cost = [3, 5, 9]
supply_cost = [15, 32, 55]

[[upgrade]]
key = "plating_shield"
slots = ["shield"]
icon = "plt"
name = "FIELD PLATING"
description = "Hull-hugging. Some rounds get through it -- fewer with every layer."
kind = "shield"
shield_type = "plating"
# The bubble first: a side learns to hold a field at all before it learns to
# wrap one round a hull. Checked against what the FACTION has learned rather
# than what this hull carries -- the two emitters replace each other, so no
# hull can ever have a bubble fitted at the moment it fits plating.
requires = "bubble_shield"
max_level = 3
weight = 0.9
capacity = 112.0
regen_per_second = 7.0
regen_delay_seconds = 1.0
# Plating leaks by chance rather than by a fixed share of every hit: half the
# rounds are stopped whole, and the rest put leak_fraction of themselves into
# the hull behind. That is what keeps it from being strictly better than the
# bubble's bigger, slower reservoir -- and what makes a bad exchange under it
# a run of luck rather than arithmetic.
leak_chance = 0.5
# One entry per level: a quarter of the round gets through at the first layer,
# a tenth at the third.
leak_fraction = [0.25, 0.175, 0.10]
tech_cost = [3, 5, 9]
supply_cost = [15, 32, 55]
