scale = 0.05

[physics]
density = 1
# Surface thrust/weight of ~1.4 on a standard planet (Body::DEFAULT_THRUST) --
# enough to leave the ground it landed on, with margin for a heavier rock.
thrust = 220
# Top speed the thruster alone can reach; gravity can still slingshot past it.
# Roughly an order of magnitude over orbital speed at the usual planet radii,
# so crossing the sector is quick and the cap only bites on a long burn.
max_speed = 2000
restitution = 0.5
friction = 0.0

# Multiplier on landing damage only (see Body::GetLandingFragility); 1.0 is
# the stock airframe every other hull is judged against.
[landing]
fragility = 1.0

[weapons]
# How far off the nose this hull's gimbals can swing a beam, total. The 60
# degrees it leaves out are directly astern: a pilot with something on their
# tail has to turn into it, not just look at it.
aim_arc_degrees = 300
