# AI temperaments. A preset overrides only the fields it names; the rest keep
# the C++ defaults on AIPersonality / GuidanceParams / FlightControllerParams /
# AIStrategyWeights, which is why `balanced` below is empty rather than a copy
# of them. `key` is what the debug panel and --ai-preset address it by;
# `weight` is its share of a random pick. The first entry is what anything
# unconfigured flies.
#
# `fit` is what a pilot walks out of a yard carrying: a multiplier per upgrade
# kind on the catalog's own "cover a gap before deepening a strength" scoring
# (1 leaves that judgement alone, 0 refuses the kind). Together with
# `supply_reserve` -- what it will not spend, in Supplies, at ~0.6/s of income
# and 8 a kill -- it also decides whether a trip home is worth making at all:
# a pilot with nothing it wants and can afford has no business at a pad.

[[preset]]
key = "balanced"
name = "Balanced"
description = "The original single tuning -- every default, nothing overridden."
weight = 1.0
# Keeps back roughly a minute's income, so it can always pay to rearm.
personality = { supply_reserve = 30 }

[[preset]]
key = "aggressive"
name = "Aggressive"
description = "Chases farther, fires looser and faster, cuts closer to wells."
weight = 1.0
# Breaks off late and hard: stays in the fight down to a sliver of hull, and
# only counts an attacker as a threat once it is genuinely close.
personality = { engage_range = 8000.0, standoff_distance = 35.0, fire_range = 440.0, fire_tolerance = 0.14, aim_priority_error = 220.0, evade_radius = 140.0, evade_margin = 1.3, danger_lookahead_steps = 90, decision_interval = 9, fire_interval = 5, reaction_jitter = 0.1, aim_jitter = 0.03, flee_health_fraction = 0.12, flee_range = 550.0, jink_speed = 42.0, jink_period = 20, upgrade_greed = 2, supply_reserve = 10, missile_interval = 90 }
guidance    = { max_speed = 110.0, transit_speed = 500.0, merge_range = 350.0, flip_time = 0.9, orbit_radial_kp = 0.6, max_radial_speed = 25.0, touchdown_speed = 9.0 }
flight      = { heading_kp = 7.5, heading_kd = 1.3, turn_deadband = 0.2, aim_tolerance = 0.3, min_burn_ticks = 10, min_coast_ticks = 8 }
strategy    = { dogfight = 1.3, claim = 0.8, attack_complex = 1.5, intercept_freighter = 1.1, defend = 0.6, rearm = 0.7 }
# Buys guns and the burn to bring them into range. Shields are for pilots who
# expect to be hit, and it does not spend the fight expecting that.
fit         = { cannon = 1.5, weapon = 1.3, capacitor = 1.4, fire_rate = 1.2, shield = 0.5, missile = 0.8 }

[[preset]]
key = "cautious"
name = "Cautious"
description = "Keeps distance, wants a clean shot, evades earlier and wider."
weight = 1.0
personality = { engage_range = 4500.0, standoff_distance = 70.0, fire_range = 340.0, fire_tolerance = 0.08, aim_priority_error = 130.0, evade_radius = 260.0, evade_margin = 2.0, danger_lookahead_steps = 150, decision_interval = 14, fire_interval = 9, reaction_jitter = 0.05, aim_jitter = 0.015, flee_health_fraction = 0.35, flee_range = 900.0, flee_margin = 1.8, jink_speed = 32.0, jink_period = 30, upgrade_greed = 4, supply_reserve = 60 }
guidance    = { max_speed = 65.0, transit_speed = 320.0, merge_range = 800.0, flip_time = 1.5, orbit_radial_kp = 0.4, max_radial_speed = 15.0, touchdown_speed = 5.5 }
flight      = { heading_kp = 5.0, heading_kd = 1.8, turn_deadband = 0.3, aim_tolerance = 0.4, min_burn_ticks = 20, min_coast_ticks = 18 }
strategy    = { dogfight = 0.7, claim = 1.3, attack_complex = 0.6, intercept_freighter = 0.8, defend = 1.5, rearm = 1.4 }
# Everything that keeps a hull alive first, and a purse deep enough that it is
# never caught unable to rearm.
fit         = { shield = 1.8, engine = 1.3, capacitor = 1.1, cannon = 0.6, fire_rate = 0.8 }

# Three rounds from every barrel, then a real cooldown -- reads as a sniper's
# controlled burst rather than a steady drip. Picks off soft targets:
# raids commerce, avoids the complexes that shoot back. Patient on the ground
# too: it sits out a whole research cycle for a second upgrade before it
# launches at all.
[[preset]]
key = "sniper"
name = "Sniper"
description = "Long standoff, precise fire, patient."
weight = 1.0
personality = { engage_range = 6000.0, standoff_distance = 180.0, fire_range = 520.0, fire_tolerance = 0.04, aim_priority_error = 200.0, evade_radius = 200.0, evade_margin = 1.6, danger_lookahead_steps = 120, decision_interval = 14, burst_count = 3, fire_interval = 26, aim_jitter = 0.008, flee_health_fraction = 0.4, flee_range = 1000.0, flee_margin = 1.8, jink_speed = 18.0, jink_period = 34, upgrade_greed = 4, pad_wait_ticks = 3600, supply_reserve = 50, missile_interval = 80 }
guidance    = { max_speed = 70.0, transit_speed = 360.0, merge_range = 1200.0 }
# Long, settled burns: a sniper spends its transit lining up, not fidgeting
# with the throttle.
flight      = { aim_tolerance = 0.2, min_burn_ticks = 24, min_coast_ticks = 22 }
strategy    = { dogfight = 0.9, claim = 1.0, attack_complex = 0.7, intercept_freighter = 1.5, defend = 0.9, rearm = 1.2 }
# Reach, and the rounds to use it with: the rack outranges the gun, and spare
# rounds matter to a pilot whose whole method is not missing.
fit         = { missile = 1.6, weapon = 1.4, ammo = 1.3, fire_rate = 1.1, cannon = 0.7, capacitor = 0.6 }

[[preset]]
key = "reckless"
name = "Reckless"
description = "Fastest and most trigger-happy; sometimes flies straight into a well."
weight = 1.0
# flee_health_fraction = 0 is the point of the temperament: it never breaks
# off, whatever is left of it. rearm = 0 and pad_wait_ticks = 0 are the same
# idea on the ground -- it never goes home to patch up and never waits for a
# lab to finish anything.
personality = { engage_range = 7000.0, standoff_distance = 30.0, fire_range = 400.0, fire_tolerance = 0.16, aim_priority_error = 260.0, evade_radius = 120.0, evade_margin = 1.2, danger_lookahead_steps = 60, decision_interval = 10, fire_interval = 6, reaction_jitter = 0.15, aim_jitter = 0.05, danger_ignore_chance = 0.15, flee_health_fraction = 0.0, jink_speed = 46.0, jink_period = 16, pad_wait_ticks = 0, supply_reserve = 0, missile_interval = 80 }
# touchdown_speed is as close to SAFE_LANDING_SPEED as contact overshoot allows.
guidance    = { max_speed = 120.0, transit_speed = 600.0, merge_range = 250.0, flip_time = 0.8, touchdown_speed = 10.0 }
flight      = { heading_kp = 8.0, turn_deadband = 0.15, min_burn_ticks = 7, min_coast_ticks = 5 }
strategy    = { dogfight = 1.5, claim = 0.7, attack_complex = 1.6, intercept_freighter = 1.2, defend = 0.3, rearm = 0.0 }
# Spends every last Supply on hitting harder, and buys no shield at all -- the
# same temperament its flee_health_fraction = 0 already states.
fit         = { cannon = 1.8, capacitor = 1.6, weapon = 1.3, fire_rate = 1.3, shield = 0.0, engine = 0.0 }
