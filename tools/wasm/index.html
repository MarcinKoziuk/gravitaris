<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GravitarisNG</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #ccc;
            font-family: monospace;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #status {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 14px;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="status">Loading…</div>
    <!-- Magnum's Sdl2Application hardcodes the id "#canvas" on Emscripten. -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        // Substituted by tools/wasm/build.sh when it copies this file into the
        // build output. Left as the literal placeholder when the source tree is
        // served directly, in which case the query is dropped entirely.
        var BUILD_VERSION = '__GRAVITARIS_VERSION__';
        var versionQuery = BUILD_VERSION.indexOf('__') === 0 ? '' : '?v=' + BUILD_VERSION;

        var Module = {
            canvas: document.getElementById('canvas'),
            // The three artifacts keep stable filenames across deploys, so the
            // build id rides in the query string instead: a new build is a new
            // cache key, which is what lets them be served immutable. Both the
            // .wasm and the preloaded .data are resolved through here.
            locateFile: function (path, prefix) {
                return prefix + path + versionQuery;
            },
            setStatus: function (text) {
                document.getElementById('status').innerText = text;
            },
            print: function (text) {
                console.log(text);
            },
            printErr: function (text) {
                console.error(text);
            },
            onRuntimeInitialized: function () {
                // Magnum's Sdl2Application only re-syncs its internal
                // viewport/framebuffer size in response to an actual size
                // change -- a synthetic `dispatchEvent(new Event('resize'))`
                // with no real dimension change is a no-op (confirmed: it does
                // not fix the bug below), which is presumably why the app
                // looks wrong at the wrong aspect ratio/pixel density on the
                // very first frame but self-corrects the instant the user
                // actually resizes the window. Force a genuine (1px, cosmetically
                // invisible) canvas box change instead: shrink it a frame, then
                // restore, so Magnum's resize handling sees two real deltas
                // and settles on the correct final size on its own.
                const canvas = document.getElementById('canvas');
                requestAnimationFrame(function () {
                    const restoreWidth = canvas.style.width;
                    canvas.style.width = (canvas.clientWidth - 1) + 'px';
                    requestAnimationFrame(function () {
                        canvas.style.width = restoreWidth;
                    });
                });
            },
        };
        Module.setStatus('Downloading…');

        // Loaded from script rather than a <script src> so the glue carries the
        // same token as the files it goes on to fetch.
        var glue = document.createElement('script');
        glue.src = 'GravitarisNG.js' + versionQuery;
        document.body.appendChild(glue);
    </script>
</body>
</html>
