<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <g inkscape:label="@body" inkscape:groupmode="layer">
    <rect style="fill:none;stroke:#803300" width="1" height="10" x="-0.5" y="-5" />
  </g>
  <!-- Nose along -Y, matching a fighter's own facing (see ComputeBulletSpawn). -->
  <g inkscape:label="model" inkscape:groupmode="layer">
    <path style="fill:none;stroke:#ff8844;stroke-width:1px" d="M 0,-5 L 0.5,1 L 0.5,5 L -0.5,5 L -0.5,1 Z" />
    <path style="fill:none;stroke:#ff8844;stroke-width:1px" d="M -0.5,3.5 L -1.2,5.5 M 0.5,3.5 L 1.2,5.5" />
  </g>
  <g inkscape:label="@origin" inkscape:groupmode="layer">
    <circle style="fill:#ff0000;stroke:#803300" cx="0" cy="0" r="1" />
  </g>
</svg>
