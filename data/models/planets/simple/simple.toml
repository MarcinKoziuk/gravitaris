# Radius 299.5 in the svg, so ~120 world units. Mass scales with the square
# of that radius, keeping the pull at the surface -- the thing the whole game
# is built around -- where it was at the old half-size planet.
scale = 0.4
render_order = -10

[physics]
mass = 100000
kinematic = true
density = 10
restitution = 0.5
friction = 10.0

[gravity]
is_source = true
is_target = false
multiplier = 0.4
